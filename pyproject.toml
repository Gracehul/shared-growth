[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drawing_robot"
version = "0.1.0"
description = "Cartesian control for the myCobot 280, built on pymycobot -- Shared Growth Milestone 1"
requires-python = ">=3.10"
dependencies = [
    "pymycobot",
    "numpy",
]

[tool.setuptools]
packages = ["drawing_robot"]
