[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drawing_robot"
version = "0.1.0"
description = "Cartesian control for the myCobot 280, built on pymycobot -- Shared Growth Milestone 1"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
hardware = [
    "pymycobot",
]
dev = [
    "pytest>=8",
]

[project.scripts]
drawing-robot-preflight = "drawing_robot.preflight:main"

[tool.setuptools.packages.find]
include = ["drawing_robot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: supervised tests that require an explicitly released physical robot",
]
