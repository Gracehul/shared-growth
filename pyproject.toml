[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drawing_robot"
version = "0.1.0"
description = "Cartesian control for the myCobot 280, built on pymycobot -- Shared Growth Milestone 1"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
hardware = [
    "pymycobot",
]
dev = [
    "pytest>=8",
]

[project.scripts]
drawing-robot-preflight = "drawing_robot.preflight:main"

[tool.setuptools]
packages = ["drawing_robot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
