<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Shared Growth — Deployment Baseline v1.0</title>
  <desc id="desc">Physical deployment of the browser workstation, Nano backend, UART robot connection, and offline SimRobot alternative.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" fill="#15803d"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#15803d"/>
    </marker>
    <style>
      .bg { fill:#f8fafc; }
      .title { font:700 30px Arial,sans-serif; fill:#0f172a; }
      .subtitle { font:400 15px Arial,sans-serif; fill:#475569; }
      .zone { fill:#fff; stroke:#94a3b8; stroke-width:2; rx:16; }
      .zoneLaptop { fill:#eff6ff; stroke:#3b82f6; }
      .zoneNano { fill:#fff7ed; stroke:#f97316; }
      .zoneOffline { fill:#f0fdf4; stroke:#22c55e; }
      .zoneTitle { font:700 18px Arial,sans-serif; fill:#0f172a; }
      .node { fill:#fff; stroke:#94a3b8; stroke-width:1.4; rx:9; }
      .label { font:700 14px Arial,sans-serif; fill:#0f172a; text-anchor:middle; }
      .small { font:400 12px Arial,sans-serif; fill:#475569; text-anchor:middle; }
      .tiny { font:400 11px Arial,sans-serif; fill:#64748b; }
      .cmd { fill:none; stroke:#2563eb; stroke-width:2.5; marker-end:url(#arrow); }
      .state { fill:none; stroke:#15803d; stroke-width:2.2; stroke-dasharray:7 5; marker-start:url(#arrowBack); }
      .stateEnd { fill:none; stroke:#15803d; stroke-width:2.2; stroke-dasharray:7 5; marker-end:url(#arrowGreen); }
      .internal { fill:none; stroke:#475569; stroke-width:2; marker-end:url(#arrow); }
      .boundary { fill:none; stroke:#cbd5e1; stroke-width:1.5; stroke-dasharray:6 5; rx:12; }
      .badge { fill:#e2e8f0; rx:8; }
      .badgeText { font:700 11px Arial,sans-serif; fill:#334155; text-anchor:middle; }
      .section { font:700 15px Arial,sans-serif; fill:#334155; letter-spacing:1px; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1040"/>
  <text class="title" x="60" y="55">Shared Growth — Deployment Baseline</text>
  <text class="subtitle" x="60" y="82">Implemented hardware deployment and offline SimRobot composition</text>

  <rect class="zone zoneLaptop" x="60" y="125" width="370" height="340"/>
  <text class="zoneTitle" x="90" y="162">Laptop</text>
  <text class="tiny" x="90" y="184">Operator-facing process boundary</text>

  <rect class="node" x="105" y="220" width="280" height="78"/>
  <text class="label" x="245" y="251">Browser</text>
  <text class="small" x="245" y="273">Robot Interaction Workstation UI</text>

  <rect class="node" x="105" y="345" width="280" height="78"/>
  <text class="label" x="245" y="376">HTTP client</text>
  <text class="small" x="245" y="398">status · operation · stop</text>

  <path class="cmd" d="M245 298 V345"/>
  <path class="stateEnd" d="M270 345 V298"/>

  <rect class="boundary" x="480" y="125" width="210" height="340"/>
  <text class="zoneTitle" x="515" y="162">Network</text>
  <text class="small" x="585" y="220">HTTP</text>
  <text class="small" x="585" y="242">Workstation API v1</text>
  <path class="cmd" d="M430 270 H735"/>
  <path class="stateEnd" d="M735 315 H430"/>
  <text class="tiny" x="510" y="290">requests →</text>
  <text class="tiny" x="510" y="335">← snapshot / receipts</text>

  <rect class="zone zoneNano" x="735" y="125" width="805" height="690"/>
  <text class="zoneTitle" x="770" y="162">Jetson Nano</text>
  <text class="tiny" x="770" y="184">One workstation backend process · authoritative hardware composition</text>

  <rect class="node" x="790" y="220" width="250" height="72"/>
  <text class="label" x="915" y="249">Workstation backend</text>
  <text class="small" x="915" y="270">HTTP + SystemSnapshotAdapter</text>

  <rect class="node" x="1090" y="220" width="250" height="72"/>
  <text class="label" x="1215" y="249">OperationController</text>
  <text class="small" x="1215" y="270">gates + authoritative receipt</text>

  <rect class="node" x="1090" y="335" width="250" height="72"/>
  <text class="label" x="1215" y="364">MotionExecutor</text>
  <text class="small" x="1215" y="385">RobotInterface contract</text>

  <rect class="node" x="1090" y="450" width="250" height="72"/>
  <text class="label" x="1215" y="479">MyCobotRobot</text>
  <text class="small" x="1215" y="500">hardware adapter + normalized state</text>

  <rect class="node" x="1090" y="565" width="250" height="72"/>
  <text class="label" x="1215" y="594">RobotService</text>
  <text class="small" x="1215" y="615">single command/telemetry scheduler</text>

  <rect class="node" x="1090" y="680" width="250" height="72"/>
  <text class="label" x="1215" y="709">RobotIO</text>
  <text class="small" x="1215" y="730">exclusive serial owner</text>

  <rect class="node" x="790" y="335" width="250" height="84"/>
  <text class="label" x="915" y="365">SystemSnapshotAdapter</text>
  <text class="small" x="915" y="386">CURRENT GATE + RobotState</text>
  <text class="small" x="915" y="403">ExecutionLog + latest event</text>

  <rect class="node" x="790" y="475" width="250" height="84"/>
  <text class="label" x="915" y="505">Evidence stores</text>
  <text class="small" x="915" y="526">ExecutionLog</text>
  <text class="small" x="915" y="543">OperationReceipt / LAST ACTION</text>

  <path class="internal" d="M1040 256 H1090"/>
  <path class="internal" d="M1215 292 V335"/>
  <path class="internal" d="M1215 407 V450"/>
  <path class="internal" d="M1215 522 V565"/>
  <path class="internal" d="M1215 637 V680"/>

  <path class="stateEnd" d="M1090 600 H1060 V377 H1040"/>
  <path class="stateEnd" d="M915 335 V292"/>
  <path class="stateEnd" d="M790 377 H760 Q745 377 745 315 H690"/>
  <path class="internal" d="M1090 486 H1040"/>
  <path class="internal" d="M1090 371 H1070 V505 H1040"/>
  <path class="internal" d="M1090 256 H1060 V535 H1040"/>

  <rect class="badge" x="800" y="680" width="220" height="58"/>
  <text class="badgeText" x="910" y="704">AUTHORITATIVE OWNERS</text>
  <text class="small" x="910" y="722">gate: controller · state: snapshot</text>
  <text class="small" x="910" y="738">UART: RobotIO · log: ExecutionLog</text>

  <rect class="boundary" x="1100" y="850" width="230" height="90"/>
  <text class="zoneTitle" x="1140" y="882">UART</text>
  <text class="small" x="1215" y="907">/dev/ttyTHS1 · 1,000,000 baud</text>
  <path class="cmd" d="M1215 752 V850"/>
  <path class="stateEnd" d="M1245 850 V752"/>

  <rect class="zone" x="1370" y="850" width="170" height="90"/>
  <text class="zoneTitle" x="1395" y="882">myCobot</text>
  <text class="small" x="1455" y="907">280 JN controller</text>
  <path class="cmd" d="M1330 885 H1370"/>
  <path class="stateEnd" d="M1370 915 H1330"/>

  <text class="section" x="60" y="530">OFFLINE ALTERNATIVE</text>
  <rect class="zone zoneOffline" x="60" y="555" width="630" height="385"/>
  <text class="zoneTitle" x="90" y="592">Laptop or development host</text>
  <text class="tiny" x="90" y="614">No UART and no hardware process are opened.</text>

  <rect class="node" x="105" y="655" width="230" height="72"/>
  <text class="label" x="220" y="684">Workstation backend</text>
  <text class="small" x="220" y="705">same HTTP/read contract</text>

  <rect class="node" x="410" y="655" width="230" height="72"/>
  <text class="label" x="525" y="684">OperationController</text>
  <text class="small" x="525" y="705">same operation contract</text>

  <rect class="node" x="410" y="790" width="230" height="72"/>
  <text class="label" x="525" y="819">MotionExecutor</text>
  <text class="small" x="525" y="840">same RobotInterface</text>

  <rect class="node" x="105" y="790" width="230" height="72"/>
  <text class="label" x="220" y="819">SimRobot</text>
  <text class="small" x="220" y="840">deterministic offline backend</text>

  <path class="internal" d="M335 691 H410"/>
  <path class="internal" d="M525 727 V790"/>
  <path class="internal" d="M410 826 H335"/>
  <path class="stateEnd" d="M220 790 V727"/>

  <rect class="badge" x="60" y="975" width="410" height="34"/>
  <text class="badgeText" x="265" y="997">LEGACY REMOVED: drawing_robot.motion.MotionExecutor · RunLog</text>
  <text class="tiny" x="620" y="997">Deferred/future systems are intentionally absent from this frozen deployment baseline.</text>
</svg>
